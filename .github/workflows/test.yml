name: Test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            config: Release
            tests: ./build/test/SiocTest
          # the asserts only fire without NDEBUG
          - os: ubuntu-latest
            config: Debug
            tests: ./build/test/SiocTest
          - os: windows-latest
            config: Release
            tests: ./build/test/Release/SiocTest.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -Werror=author -Werror=deprecated
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCMAKE_LINK_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build --parallel --config ${{ matrix.config }}

      - name: Run tests
        run: ${{ matrix.tests }}

  clang-tidy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install clang-tidy
        run: pipx install clang-tidy==23.1.3

      - name: Configure
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Check the tests and the C++17 check, which instantiate every header
        run: |
          status=0
          for file in test/*.cpp test/Detail/*.cpp check/*.cpp; do
            clang-tidy -p build --quiet "$file" || status=1
          done
          exit $status
